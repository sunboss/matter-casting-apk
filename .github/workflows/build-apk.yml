# ============================================================================
# Matter tv-casting-app 云端构建 workflow
#
# 仓库布局要求（repo root）:
#   App/                              <- 本地
#                                      ~/workspace/matter-casting-build/connectedhomeip/examples/tv-casting-app/android/App/
#                                      的完整拷贝（含 app/libs/jniLibs 下的预编译 .so 和 app/libs 下的 .jar）
#   .github/workflows/build-apk.yml   <- 本文件
#
# 为什么不用 connectedhomeip 完整仓库：
#   connectedhomeip 是 11GB 的完整 Matter SDK 仓库，在 Actions 里 checkout
#   太慢且无必要。App/ 只有约 42MB 且自包含：
#     - native .so 已预编译在 app/libs/jniLibs/arm64-v8a/（libTvCastingApp.so + libc++_shared.so）
#     - Java 依赖 jar 已预置在 app/libs/（TvCastingApp.jar 等）
#     - build.gradle 里虽有 externalNativeBuild cmake 声明，但没有配置 cmake path，
#       AGP 不会创建 native 构建任务，因此不需要 NDK/CMake
#   构建只需要：JDK 17 + Android SDK（platform 34 / build-tools 34.0.0）+ Gradle 8.7（走 wrapper）
#
# 使用方法：
#   1. 新建 GitHub 仓库（例如 sunboss/matter-casting-apk）
#   2. 把本地 App/ 目录和本 workflow 文件 push 到该仓库根目录
#   3. Actions 页手动触发 "Build tv-casting-app APK"（或 push 到 main 自动触发）
#   4. 构建产物 tv-casting-app-debug.zip（含 app-debug.apk）在 Artifacts 下载
# ============================================================================

name: Build tv-casting-app APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'App/**'
      - '.github/workflows/build-apk.yml'

env:
  APP_DIR: App   # Gradle 工程根目录（settings.gradle 所在目录）

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform 34 and build-tools 34.0.0
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ env.APP_DIR }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Show APK info
        working-directory: ${{ env.APP_DIR }}
        run: |
          ls -lh app/build/outputs/apk/debug/
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | head -5 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tv-casting-app-debug
          path: ${{ env.APP_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
